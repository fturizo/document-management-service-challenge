#Spring Boot Configuration
spring.application.name=Document Management Service Application
#JPA Configuration Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
#Servlet Multipart Configuration Settings
#The max file size is configured beyond the 500MB to allow the API to respond its validation
# This threshold is to prevent the controller to deal with larger payloads
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
#Embedded Web Server Settings
server.tomcat.max-connections=150
server.tomcat.threads.max=15
server.tomcat.max-keep-alive-requests=25
server.tomcat.accept-count=25
#Default Application Properties
app.document.storage.expiration-time=15
app.document.storage.expiration-unit=minutes
#Loggers
logging.level.com.clara.ops.challenge.document_management_service_challenge=info
