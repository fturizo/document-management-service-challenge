#JPA Configuration Settings
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
#Servlet Multipart Configuration Settings
#The max file size is configured beyond the 500MB to allow the API to respond its validation
# This threshold is to prevent the controller to deal with larger payloads
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
#Default Application Properties
app.document.storage.expiration-time=30
app.document.storage.expiration-unit=seconds
