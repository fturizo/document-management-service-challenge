openapi: 3.0.3
info:
  title: Document Management Service API
  description: |
    REST API for the Document Management Service. Provides endpoints
    for user registration and document upload, download, and search.
  version: 0.0.1-SNAPSHOT

servers:
  - url: http://localhost:8080
    description: Local Development Server

tags:
  - name: Registration
    description: User registration operations
  - name: Document Management
    description: Document upload, download, and search operations

paths:
  /registration:
    post:
      tags:
        - Registration
      summary: Register a new user
      description: Registers a new user in the service to upload and interact with their documents.
      operationId: saveNewUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserData'
      responses:
        '200':
          description: User registered successfully
        '400':
          description: Invalid user data supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '409':
          description: User is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'

  /document-management/upload:
    post:
      tags:
        - Document Management
      summary: Upload a new document
      description: |
        Uploads a new PDF document along with its metadata.
        The document size cannot exceed 500MB.
        This operation supports a maximum threshold of 10 concurrent uploads in the entire service.
      operationId: uploadNewDocument
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - data
              properties:
                file:
                  type: string
                  format: binary
                  description: The document file to upload, Only PDF documents are supported (`Content-Type=application/pdf`)
                data:
                  $ref: '#/components/schemas/NewDocumentData'
      responses:
        '201':
          description: Document uploaded successfully
          headers:
            Location:
              description: |
                URI of the newly created document resource
              schema:
                type: string
                format: uri
        '400':
          description: |
            Invalid document metadata supplied (e.g. invalid document name or tags)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: |
            Unauthorized user, requires authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '409':
          description: |
            Conflict – a document with the same name uploaded by the authenticated user already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '413':
          description: |
            Payload too large – The size of the uploaded document exceed the 500MB limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '422':
          description: |
            Unprocessable Entity – concurrent upload threshold reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: |
            Internal server error – Storage failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'

  /document-management/download/{id}:
    get:
      tags:
        - Document Management
      summary: Get download data for an stored document
      description: |
        Retrieves the download location information for a document by its ID. 
        The URL will have an expiration time attached to it on the response data, after which it will cease to function.
      operationId: getDownloadData
      security:
        - basicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The identifier of the document
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: |
            Download location retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentLocation'
        '403':
          description: |
            Forbidden – The authenticated user doesn't own the corresponding document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: |
            Document not found matching the supplied ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: |
            Internal server error – storage failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'

  /document-management/search:
    get:
      tags:
        - Document Management
      summary: Search documents
      description: |
        Searches for documents matching the given criteria with pagination support.
        Default page size is 20, sorted by the createdAt property in ascending order.
      operationId: searchDocuments
      security:
        - basicAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page index
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          description: Number of results per page
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          description: >-
            Sorting criteria in the format `property,direction` (e.g. `createdAt,asc`).
            Default sort is `createdAt,asc`.
            Supported properties are: `id`, `name`, `fileSize`, `tags`, `createdAt`.
          schema:
            type: string
            default: createdAt,asc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchData'
      responses:
        '200':
          description: Paginated list of documents matching the search criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDocumentData'
        '400':
          description: Validation error in supplied search data or invalid sort criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Basic Authentication Scheme (Username and Encoded password)

  schemas:
    UserData:
      type: object
      description: |
        Represents the information of a registered (or to be registered) user.
      required:
        - username
        - password
        - fullName
      properties:
        username:
          type: string
          minLength: 5
          maxLength: 50
          pattern: '^[a-zA-Z0-9]*$'
          description: |
            The username of the new user. Only letters (uppercase/lowercase) and numbers are allowed.
        password:
          type: string
          minLength: 8
          maxLength: 50
          description: The password of the new user.
        fullName:
          type: string
          minLength: 10
          maxLength: 50
          description: The full name of the new user.

    NewDocumentData:
      type: object
      description: |
        Represents the metadata of a new document to be uploaded by the management service
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 50
          pattern: '^[a-zA-Z0-9]*$'
          description: |
            The name of the document. Cannot be blank. Only letters (either lowercase or uppercase) and numbers are allowed.
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
            maxLength: 20
          description: A set of tags attached to the document.

    SearchData:
      type: object
      description: Represents metadata used to search documents owned by the authenticated user.
      properties:
        name:
          type: string
          maxLength: 50
          description: A string used to partial match the name of the documents to search.
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
            maxLength: 20
          description: A set of tags to filter the documents by.

    DocumentData:
      type: object
      description: |
        Represents the metadata of document search results.
      properties:
        id:
          type: integer
          format: int64
          description: The unique identifier of the document.
        name:
          type: string
          description: The name of the document.
        fileSize:
          type: integer
          format: int64
          description: The size of the document in bytes.
        createdAt:
          type: string
          format: date-time
          description: The date and time the document was created.
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
          description: A set of tags associated with the document.

    DocumentLocation:
      type: object
      description: |
        Contains the download location information for an stored document.
      properties:
        url:
          type: string
          format: uri
          description: The URL to download the document from.
        expirationTime:
          type: integer
          description: The time after which the download URL will expire and cease to function.
        expirationUnit:
          type: string
          description: The unit of time used for the download URL expiration time
          enum:
            - nanoseconds
            - microseconds
            - milliseconds
            - seconds
            - minutes
            - hours
            - days

    PagedDocumentData:
      type: object
      description: A paginated response of document data (Spring Web Data `PagedModel`).
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/DocumentData'
        page:
          type: object
          properties:
            size:
              type: integer
              description: The size of the page.
            totalElements:
              type: integer
              format: int64
              description: Total number of elements.
            totalPages:
              type: integer
              description: Total number of pages.
            number:
              type: integer
              description: Current page number (zero-based).

    ErrorDetails:
      type: object
      description: |
        Represents details of a runtime error encountered while executing an operation.
      properties:
        message:
          type: string
          description: A general error message describing the issue.
        errors:
          type: array
          items:
            type: string
          description: A list of specific error details (e.g. field validation errors).
