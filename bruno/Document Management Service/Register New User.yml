info:
  name: Register New User
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/registration
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password": "{{password}}",
        "fullName": "Fabio Turizo"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
