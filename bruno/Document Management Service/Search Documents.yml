info:
  name: Search Documents
  type: http
  seq: 6

http:
  method: GET
  url: http://localhost:8080/document-management/search?page=0&size=20&sort=createdAt,asc&sort=fileSize,desc
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "20"
      type: query
    - name: sort
      value: createdAt,asc
      type: query
    - name: sort
      value: fileSize,desc
      type: query
  body:
    type: json
    data: |-
      {
        //"name": "Large",
        //"tags": ["metrics", "tests"]
      }
  auth: inherit

runtime:
  variables:
    - name: id
      value: "6"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
